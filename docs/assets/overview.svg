<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Upward Bias</title>
  <desc id="desc">A research data and code package for auditing, characterizing, and calibrating selection bias in self-reported peer review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5fa"/><stop offset="1" stop-color="#eef5f8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="310" rx="18" fill="url(#bg)"/>
  <rect x="42" y="39" width="6" height="72" rx="3" fill="#75518e"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="77" font-size="40" font-weight="700" fill="#252638" letter-spacing="1">UPWARD BIAS</text>
    <text x="69" y="107" font-size="18" fill="#555d71">Selection bias in self-reported peer-review outcomes</text>
    <text x="1148" y="65" text-anchor="end" font-size="13" font-weight="700" fill="#667184" letter-spacing="1.5">DATA + ANALYSIS</text>
    <text x="1148" y="96" text-anchor="end" font-size="17" fill="#356f8f">2,467 reports</text>
    <g transform="translate(42 151)">
      <rect width="355" height="116" rx="10" fill="#fff"/>
      <text x="22" y="34" font-size="13" font-weight="700" fill="#b65a57" letter-spacing="1.5">01 / AUDIT</text>
      <text x="22" y="65" font-size="20" font-weight="700" fill="#252638">Compare with the population</text>
      <text x="22" y="91" font-size="15" fill="#667184">Scores, distributions, and acceptance rates</text>
    </g>
    <g transform="translate(423 151)">
      <rect width="355" height="116" rx="10" fill="#fff"/>
      <text x="22" y="34" font-size="13" font-weight="700" fill="#356f8f" letter-spacing="1.5">02 / CHARACTERIZE</text>
      <text x="22" y="65" font-size="20" font-weight="700" fill="#252638">Understand selective visibility</text>
      <text x="22" y="91" font-size="15" fill="#667184">Outcomes and acceptance boundaries</text>
    </g>
    <g transform="translate(804 151)">
      <rect width="354" height="116" rx="10" fill="#fff"/>
      <text x="22" y="34" font-size="13" font-weight="700" fill="#75518e" letter-spacing="1.5">03 / CALIBRATE</text>
      <text x="22" y="65" font-size="20" font-weight="700" fill="#252638">Use historical benchmarks</text>
      <text x="22" y="91" font-size="15" fill="#667184">Quantile-delta correction and evaluation</text>
    </g>
  </g>
</svg>
